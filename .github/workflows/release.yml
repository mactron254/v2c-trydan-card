name: Release

on:
  push:
    tags:
      - "v0.6.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: pnpm
      - name: Verify tag and version
        id: tag
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          tag_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify committed release artifacts
        run: git diff --exit-code -- dist/v2c-trydan-card.js dist/v2c-trydan-card.js.sha256
      - name: Generate provenance
        run: node scripts/provenance.mjs "$GITHUB_REF_NAME" "${{ steps.tag.outputs.commit }}"
      - name: Upload stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/v2c-trydan-card.js \
            dist/v2c-trydan-card.js.sha256 \
            dist/v2c-trydan-card.js.provenance.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "V2C Trydan Card $GITHUB_REF_NAME" \
            --prerelease=false \
            --latest
